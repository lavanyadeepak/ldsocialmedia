<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Media Poster</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    body { 
      font-family: 'Inter', -apple-system, sans-serif; 
      background: var(--bg-gradient); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0;
    }
    .card { 
      background: rgba(255, 255, 255, 0.95); 
      padding: 2.5rem; 
      border-radius: 1.5rem; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
      width: 100%; 
      max-width: 480px; 
    }
    h1 { text-align: center; margin-bottom: 1.5rem; color: #111827; font-size: 1.5rem; font-weight: 700; }
    .field { margin-bottom:1rem; }
    label { font-weight:600; margin-bottom:0.5rem; display:block; color: #374151; font-size: 0.9rem; }
    textarea, input[type="file"] { 
      width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.75rem; 
      box-sizing: border-box; font-family: inherit; transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: var(--primary); ring: 2px solid var(--primary); }
    
    .platforms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; margin-top: 0.5rem; }
    .platform-chip {
      position: relative; display: flex; align-items: center; justify-content: center;
      padding: 0.5rem; border: 1px solid #e5e7eb; border-radius: 0.75rem;
      cursor: pointer; transition: all 0.2s ease; font-size: 0.85rem; font-weight: 500;
    }
    .platform-chip input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
    .platform-chip:hover { background: #f3f4f6; border-color: #d1d5db; }
    .platform-chip:has(input:checked) {
      background: var(--primary); color: white; border-color: var(--primary);
    }

    button { 
      width: 100%; background: var(--primary); color: #fff; padding: 0.875rem; 
      border: none; border-radius: 0.75rem; font-weight: 600; cursor: pointer; 
      transition: background 0.2s, transform 0.1s; margin-top: 1rem;
    }
    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:active { transform: scale(0.98); }
    button:disabled { background: #9ca3af; cursor: not-allowed; }

    #results { margin-top: 1.5rem; border-top: 1px solid #e5e7eb; padding-top: 1rem; display: none; }
    .result-item { 
      font-size: 0.85rem; padding: 0.5rem; border-radius: 0.5rem; margin-bottom: 0.5rem;
      display: flex; justify-content: space-between;
    }
    .status-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    
    .loader { display: none; text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--primary); font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Post to Social</h1>
    <form id="postForm">
      <div class="field">
        <label for="text">What's on your mind?</label>
        <textarea id="text" name="text" rows="4" placeholder="Write your post here..." required></textarea>
      </div>
      <div class="field">
        <label for="media">Media (Images/Video)</label>
        <input type="file" id="media" name="media" accept="image/*,video/*" onchange="previewFile()">
        <div id="preview-container" style="margin-top: 10px;"></div>
      </div>
      <div class="field">
        <label>Select Platforms</label>
        <div class="platforms-grid">
          <label class="platform-chip"><input type="checkbox" name="platforms" value="threads"> Threads</label>
          <label class="platform-chip"><input type="checkbox" name="platforms" value="twitter"> X (Twitter)</label>
          <label class="platform-chip"><input type="checkbox" name="platforms" value="bluesky"> Bluesky</label>
          <label class="platform-chip"><input type="checkbox" name="platforms" value="linkedin"> LinkedIn</label>
          <label class="platform-chip"><input type="checkbox" name="platforms" value="instagram"> Instagram</label>
          <label class="platform-chip"><input type="checkbox" name="platforms" value="mastodon"> Mastodon</label>
        </div>
      </div>
      <button type="submit">Share Post</button>
      <div class="loader" id="loader">Processing your posts...</div>
    </form>

    <div id="results">
      <h3 style="font-size: 1rem; margin-bottom: 0.75rem;">Results:</h3>
      <div id="resultsList"></div>
    </div>
  </div>

  <script>
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const form = e.target;
      const formData = new FormData(form);
      const button = form.querySelector('button');
      const loader = document.getElementById('loader');
      const resultsDiv = document.getElementById('results');
      const resultsList = document.getElementById('resultsList');

      // UI Reset
      button.disabled = true;
      loader.style.display = 'block';
      resultsDiv.style.display = 'none';
      resultsList.innerHTML = '';

      try {
        const response = await fetch('/post', { method: 'POST', body: formData });
        const results = await response.json();

        resultsDiv.style.display = 'block';
        resultsList.innerHTML = results.map(res => `
          <div class="result-item ${res.status === 'Success' ? 'status-success' : 'status-error'}">
            <span><strong>${res.platform}</strong></span>
            <span>${res.status}</span>
          </div>
        `).join('');
      } catch (err) {
        alert('An error occurred while posting.');
      } finally {
        button.disabled = false;
        loader.style.display = 'none';
      }
    });
  </script>
</body>
</html>
